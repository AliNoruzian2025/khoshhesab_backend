version: '3.8'

services:
  # دیتابیس MySQL
  mysql:
    image: mysql:8.0
    container_name: khoshhesab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: khoshhesab
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - khoshhesab-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: khoshhesab-phpmyadmin
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    networks:
      - khoshhesab-network

  # Laravel Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: khoshhesab-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - khoshhesab-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: khoshhesab-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - mysql
    networks:
      - khoshhesab-network

networks:
  khoshhesab-network:
    driver: bridge

volumes:
  mysql_data:
